<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power plants</title>
  <link rel="stylesheet" href="styles.css">
  <script src="plants.js" defer></script>
</head>
<body>
  <nav aria-label="Pages">
    <a href="plants.html" aria-current="page">Power plants</a>
    <a href="./">Demand and reserve</a>
  </nav>
  <h1>Power plants</h1>
  <p>Edit the existing plants or add a new one. Each card becomes one row in plants.csv. Plant IDs must be unique.</p>
  <form id="plants-form">
    <div class="actions">
      <button type="button" id="add-plant">Add power plant</button>
      <button type="submit">Save plants.csv</button>
      <a href="plants.csv" download>Download plants.csv</a>
    </div>
    <p id="plants-status" role="status" aria-live="polite"></p>
    <div id="plant-cards"></div>
  </form>
</body>
</html>
